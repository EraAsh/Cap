name: "build-windows"

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Create .env file in root
        shell: bash
        run: |
          {
            echo "appVersion=0.0.1"
            echo "VITE_ENVIRONMENT=production"
            echo "RUST_TARGET_TRIPLE=${{ env.RUST_TARGET_TRIPLE }}"
          } >> .env

      - name: Increase pagefile size (Windows)
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Run cap-setup
        shell: bash
        run: pnpm -w cap-setup
        env:
          RUST_TARGET_TRIPLE: ${{ env.RUST_TARGET_TRIPLE }}

      - name: Build desktop binaries (sidecars)
        shell: bash
        run: ./scripts/build-desktop-binaries.sh ${{ env.RUST_TARGET_TRIPLE }}

      - name: Build app (Tauri + NSIS)
        working-directory: apps/desktop
        run: pnpm build:tauri --target ${{ env.RUST_TARGET_TRIPLE }} --config src-tauri/tauri.prod.conf.json --bundles nsis
        env:
          CI: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET_TRIPLE: ${{ env.RUST_TARGET_TRIPLE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cap-windows
          path: |
            target/x86_64-pc-windows-msvc/release/*.exe
            target/x86_64-pc-windows-msvc/release/*.dll
            target/x86_64-pc-windows-msvc/release/bundle/**/*
          retention-days: 14
